<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Company Profile — Window & Door Review</title>
<meta name="description" content="Full editorial profile for a window & door company, with our editorial rating shown separately from the public review snapshot." />
<link rel="icon" type="image/svg+xml" href="FAVICON-BLACK.svg" />
<link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root {
    --paper: #f3efe6;
    --paper-2: #ece6d8;
    --card: #fbf9f3;
    --ink: #1c2117;
    --muted: #5e6356;
    --faint: #8f937f;
    --line: #d9d2c2;
    --accent: #2f5d3a;
    --accent-2: #b5451b;
    --accent-soft: #e7eee5;
    --gold: #c08a1e;
    --star: #c08a1e;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  .uil { line-height: 1; vertical-align: -.1em; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4, .serif { font-family: 'Inter', system-ui, sans-serif; }

  a:focus-visible, button:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px;
  }
  :focus:not(:focus-visible) { outline: none; }

  .skip-link {
    position: absolute; left: 12px; top: -48px; z-index: 200;
    background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; transition: top .15s;
  }
  .skip-link:focus { top: 12px; }

  .shell { max-width: 1040px; margin: 0 auto; padding: 0 28px; }

  /* Masthead */
  .masthead {
    position: sticky; top: 0; z-index: 100;
    border-bottom: 2px solid var(--ink);
    background: rgba(243,239,230,.9);
    backdrop-filter: saturate(140%) blur(10px);
  }
  .masthead .shell { display: flex; align-items: center; gap: 14px; padding: 18px 28px; }
  .masthead .logo { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: -.3px; display: inline-flex; align-items: center; gap: 9px; }
  .masthead .logo i { color: var(--accent); }
  .masthead nav { margin-left: auto; }
  .masthead nav a {
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
    color: var(--muted); transition: color .15s;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); padding: 8px 14px; border-radius: 100px; background: var(--card);
  }
  .masthead nav a:hover { color: var(--accent); border-color: var(--accent); }

  /* Breadcrumb */
  .crumbs { padding: 18px 0 0; font-size: 12px; color: var(--muted); }
  .crumbs a { color: var(--accent); }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs i { margin: 0 6px; color: var(--faint); font-style: normal; }

  /* ---------- Hero ---------- */
  .hero {
    margin-top: 16px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); overflow: hidden;
  }
  .hero-band { height: 10px; }
  .hero-inner { display: grid; grid-template-columns: 1fr 300px; gap: 30px; padding: 30px 32px 32px; }
  .hero-left { min-width: 0; }
  .hero-id { display: flex; align-items: center; gap: 16px; }
  .hero-logo {
    width: 68px; height: 68px; border-radius: 14px; flex: none; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 24px; font-family: 'Inter', sans-serif;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .rankchip {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 3px; margin-bottom: 7px;
  }
  .hero h1 { font-size: 34px; font-weight: 900; letter-spacing: -.8px; line-height: 1.08; }
  .hero .tagline { font-size: 14px; color: var(--muted); margin-top: 5px; }
  .hero-meta { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .hero-meta .m {
    font-size: 12px; font-weight: 500; color: var(--ink);
    background: var(--accent-soft); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 100px; display: inline-flex; align-items: center; gap: 7px;
  }
  .hero-meta .m i { color: var(--accent); }
  .hero-summary { margin-top: 18px; font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 620px; }
  .hero-vetted { margin-top: 14px; font-size: 11.5px; color: var(--faint); font-style: italic; }

  /* rating / CTA sidebar inside hero */
  .hero-right { }
  .ratingbox {
    position: sticky; top: 90px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--paper); padding: 24px; text-align: center;
    box-shadow: 0 8px 28px rgba(28,33,23,.07);
  }
  .ratingbox .lab { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--accent-2); }
  .ratingbox .big { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: var(--accent); margin-top: 6px; }
  .ratingbox .stars { color: var(--star); font-size: 15px; letter-spacing: 2px; margin-top: 6px; }
  .ratingbox .note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .ratingbox .bar { height: 5px; border-radius: 100px; background: var(--line); margin-top: 12px; overflow: hidden; }
  .ratingbox .bar > span { display: block; height: 100%; width: 0; border-radius: 100px; transition: width .9s cubic-bezier(.2,.7,.2,1); }
  .ratingbox .bar.ed > span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .ratingbox .bar.pub > span { background: var(--faint); }
  .ratingbox .divider { height: 1px; background: var(--line); margin: 18px 0; }
  .ratingbox .snap-lab { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; color: var(--faint); }
  .ratingbox .snap-val { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px; color: var(--ink); margin-top: 4px; }
  .ratingbox .snap-note { font-size: 10.5px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
  .cta-btn {
    margin-top: 18px; width: 100%; cursor: pointer; border: none;
    font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    color: var(--paper); background: var(--accent); padding: 14px 18px; border-radius: 100px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: filter .15s, transform .15s, box-shadow .15s;
  }
  .cta-btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(47,93,58,.3); }
  .cta-btn .arrow, .cta-sub .arrow { transition: transform .15s; }
  .cta-btn:hover .arrow { transform: translateX(2px); }
  .cta-sub {
    margin-top: 10px; width: 100%; cursor: pointer;
    font-size: 13px; font-weight: 700; color: var(--accent);
    background: var(--card); border: 1px solid var(--line); border-radius: 100px;
    padding: 12px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color .15s, color .15s;
  }
  .cta-sub:hover { border-color: var(--accent); }

  /* ---------- Body sections ---------- */
  .body { display: grid; grid-template-columns: 1fr 300px; gap: 30px; margin: 34px 0 60px; }
  .main-col { min-width: 0; }

  .section { margin-bottom: 36px; }
  .section > h2 {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink); font-weight: 700;
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .section > h2 i { color: var(--accent); font-size: 18px; }
  .section > h2::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .section p { font-size: 14.5px; color: var(--ink); line-height: 1.8; }
  .section p + p { margin-top: 12px; }

  /* services icon grid */
  .svc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .svc-grid .svc {
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 15px 16px;
    display: flex; align-items: center; gap: 13px;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .svc-grid .svc:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(28,33,23,.07); }
  .svc-grid .svc i { color: var(--accent); font-size: 22px; flex: none; }
  .svc-grid .svc .n { font-size: 14px; font-weight: 600; }

  /* why-choose reason cards */
  .reasons { display: flex; flex-direction: column; gap: 12px; }
  .reasons .r {
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 16px 18px;
    display: flex; gap: 15px; align-items: flex-start;
    transition: border-color .15s, box-shadow .15s;
  }
  .reasons .r:hover { border-color: var(--accent); box-shadow: 0 6px 16px rgba(28,33,23,.06); }
  .reasons .r .ic {
    width: 38px; height: 38px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: 18px;
  }
  .reasons .r h3 { font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 700; }
  .reasons .r p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 3px; }

  /* verified list */
  .verified { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .verified li { display: flex; gap: 10px; font-size: 13.5px; color: var(--ink); line-height: 1.55; }
  .verified li i { color: var(--accent); font-size: 16px; margin-top: 2px; flex: none; }

  /* public snapshot note */
  .snapnote {
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 15px 18px;
    background: var(--accent-soft); font-size: 13.5px; color: var(--ink); line-height: 1.65;
  }
  .snapnote .tag { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .5px; color: var(--accent); margin-bottom: 6px; }

  /* FAQ */
  .faq { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary {
    list-style: none; cursor: pointer; padding: 16px 2px; font-family: 'Inter', sans-serif;
    font-size: 16px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary:hover { color: var(--accent); }
  .faq summary .chev { color: var(--accent); font-size: 18px; transition: transform .2s; flex: none; }
  .faq details[open] summary .chev { transform: rotate(180deg); }
  .faq .ans { padding: 0 2px 18px; font-size: 14px; color: var(--muted); line-height: 1.7; }

  /* ---------- Sidebar ---------- */
  .side-col { align-self: start; }
  .panel {
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 20px; margin-bottom: 20px;
    transition: box-shadow .15s;
  }
  .panel:hover { box-shadow: 0 6px 16px rgba(28,33,23,.05); }
  .panel h3 { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-2); font-weight: 700; margin-bottom: 14px; }
  .facts-list { display: flex; flex-direction: column; gap: 12px; }
  .facts-list .f { display: flex; gap: 11px; align-items: flex-start; }
  .facts-list .f i { color: var(--accent); font-size: 17px; flex: none; margin-top: 1px; }
  .facts-list .f .k { font-size: 10.5px; color: var(--muted); }
  .facts-list .f .v { font-size: 13px; font-weight: 600; line-height: 1.4; }

  .trust-list { display: flex; flex-direction: column; gap: 9px; }
  .trust-list .tr { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 500; }
  .trust-list .tr i { color: var(--accent); font-size: 16px; flex: none; }

  .src-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .src-list li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .src-list li i { color: var(--accent); flex: none; }

  /* bottom disclaimer + cta */
  .disclaimer {
    border: 1px dashed var(--line); border-radius: 10px; padding: 18px 22px;
    font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 40px;
  }
  .disclaimer strong { color: var(--ink); }

  .footcta {
    margin-bottom: 60px; padding: 36px; border-radius: 12px; background: var(--ink); color: var(--paper);
    display: flex; align-items: center; gap: 26px; flex-wrap: wrap;
  }
  .footcta h3 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 800; color: var(--paper); }
  .footcta p { font-size: 13.5px; color: rgba(243,239,230,.72); margin-top: 6px; max-width: 480px; }
  .footcta .b {
    margin-left: auto; cursor: pointer; white-space: nowrap; font-weight: 700; font-size: 14px;
    color: var(--ink); background: var(--gold); padding: 14px 26px; border-radius: 100px;
    display: inline-flex; align-items: center; gap: 8px; transition: transform .15s;
  }
  .footcta .b:hover { transform: translateY(-2px); }

  /* not found */
  .notfound { padding: 90px 0; text-align: center; }
  .notfound h1 { font-size: 34px; font-weight: 800; }
  .notfound p { color: var(--muted); margin-top: 10px; }
  .notfound a { color: var(--accent); font-weight: 600; border-bottom: 1px solid var(--accent); }

  .footcta .b .arrow { transition: transform .15s; }
  .footcta .b:hover .arrow { transform: translateX(3px); }

  .section { scroll-margin-top: 90px; }

  /* back to top */
  .to-top {
    position: fixed; right: 24px; bottom: 24px; z-index: 90;
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--ink); color: var(--paper);
    display: grid; place-items: center; font-size: 20px; cursor: pointer;
    opacity: 0; visibility: hidden; transform: translateY(8px);
    transition: opacity .2s, transform .2s, visibility .2s;
    box-shadow: 0 8px 22px rgba(28,33,23,.25);
  }
  .to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
  .to-top:hover { background: var(--accent); }

  @media (max-width: 860px) {
    .hero-inner, .body { grid-template-columns: 1fr; }
    .side-col { order: -1; }
    .ratingbox { position: static; }
    .footcta { flex-direction: column; align-items: flex-start; }
    .footcta .b { margin-left: 0; }
  }
  @media (max-width: 520px) {
    .shell { padding: 0 18px; }
    .masthead .shell { padding: 14px 16px; }
    .masthead nav a { padding: 7px 11px; font-size: 11px; }
    .hero h1 { font-size: 27px; }
    .hero-inner { padding: 22px; }
    .svc-grid { grid-template-columns: 1fr; }
    .to-top { right: 16px; bottom: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#page">Skip to content</a>

<!-- Masthead -->
<header class="masthead">
  <div class="shell">
    <a class="logo" href="/"><i class="uil uil-window"></i> The Window &amp; Door Review</a>
    <nav><a href="/"><i class="uil uil-arrow-left"></i> Back to the ranking</a></nav>
  </div>
</header>

<div class="shell" id="page"><!-- rendered by JS --></div>

<button class="to-top" id="toTop" aria-label="Back to top"><i class="uil uil-arrow-up"></i></button>

<script src="windows-doors-data.js"></script>
<script>
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function qp(name){ return new URLSearchParams(location.search).get(name); }

  function starRow(score){
    var n = Math.round(parseFloat(score));
    var full = Math.max(0, Math.min(5, n));
    return '★★★★★'.slice(0, full) + '☆☆☆☆☆'.slice(0, 5 - full);
  }

  var key = qp('company') || 'canadianchoice';
  var c = COMPANIES[key];
  var page = document.getElementById('page');

  if (!c) {
    document.title = 'Profile not found — Window & Door Review';
    page.innerHTML =
      '<div class="notfound"><h1>Profile not found</h1>' +
      '<p>We couldn\u2019t find that company. <a href="/">Return to the ranking</a>.</p></div>';
  } else {
    document.title = c.name + ' — Full Profile · Window & Door Review';

    // per-company canonical + description so each profile indexes as its own page
    var canon = document.createElement('link');
    canon.rel = 'canonical';
    canon.href = 'https://topwindowsanddoorscompanies.org/company-profile-window.html?company=' + encodeURIComponent(key);
    document.head.appendChild(canon);
    document.querySelector('meta[name="description"]').setAttribute('content',
      c.name + ' — full editorial profile: our rating, public review snapshot, warranty, products and service area.');

    var gscore = c.google.split(' ')[0];
    var grest = c.google.replace(/^[^ ]+\s/, '');
    var relAttr = c.own ? 'noopener noreferrer' : 'nofollow noopener noreferrer';

    var html = '';

    // Breadcrumb
    html += '<nav class="crumbs"><a href="/">The Window &amp; Door Review</a>' +
            '<i>/</i><a href="/">Ranking</a>' +
            '<i>/</i>' + esc(c.name) + '</nav>';

    // HERO
    html += '<section class="hero">';
    html += '<div class="hero-band" style="background:' + c.color + '"></div>';
    html += '<div class="hero-inner">';

    // left
    html += '<div class="hero-left">';
    html += '<div class="hero-id">';
    html += '<div class="hero-logo" style="background:' + c.color + '">' + esc(c.logo) + '</div>';
    html += '<div><span class="rankchip">Ranked #' + c.rank + ' of 10</span>' +
            '<h1>' + esc(c.name) + '</h1>' +
            '<div class="tagline">Best for: ' + esc(c.tagline) + '</div></div>';
    html += '</div>';
    html += '<div class="hero-meta">';
    if (c.location) html += '<span class="m"><i class="uil uil-map-marker"></i>' + esc(c.location) + '</span>';
    if (c.founded) html += '<span class="m"><i class="uil uil-calendar-alt"></i>' + esc(c.founded) + '</span>';
    if (c.serves) html += '<span class="m"><i class="uil uil-map"></i>' + esc(c.serves) + '</span>';
    html += '</div>';
    html += '<p class="hero-summary">' + esc(c.about[0]) + '</p>';
    html += '<div class="hero-vetted">Vetted by the Window &amp; Door Review editorial team · Research date 26 October 2026</div>';
    html += '</div>';

    // right (rating box)
    html += '<div class="hero-right"><div class="ratingbox">';
    var edPct = Math.max(0, Math.min(100, (parseFloat(c.score) / 5) * 100));
    var pubPct = Math.max(0, Math.min(100, (parseFloat(gscore) / 5) * 100));
    html += '<div class="lab">Editorial Rating</div>';
    html += '<div class="big">' + esc(c.score) + '</div>';
    html += '<div class="stars">' + starRow(c.score) + '</div>';
    html += '<div class="bar ed"><span style="width:' + edPct + '%"></span></div>';
    html += '<div class="note">Our comparison score — <b>not</b> a Google, HomeStars or BBB rating.</div>';
    html += '<div class="divider"></div>';
    html += '<div class="snap-lab">Public Review Snapshot</div>';
    html += '<div class="snap-val">' + esc(gscore) + ' <span style="font-size:12px;color:var(--star)">' + starRow(gscore) + '</span></div>';
    html += '<div class="bar pub"><span style="width:' + pubPct + '%"></span></div>';
    html += '<div class="snap-note">' + esc(grest) + '<br>Re-check live before publishing.</div>';
    html += '<a class="cta-btn" href="' + c.site + '" target="_blank" rel="' + relAttr + '">Visit website <i class="uil uil-external-link-alt arrow"></i></a>';
    html += '<a class="cta-sub" href="' + c.site + '" target="_blank" rel="' + relAttr + '"><i class="uil uil-comment-alt-message"></i> Request a quote</a>';
    html += '</div></div>';

    html += '</div></section>';

    // BODY
    html += '<div class="body"><div class="main-col">';

    // About
    html += '<div class="section"><h2><i class="uil uil-info-circle"></i> About ' + esc(c.name) + '</h2>';
    c.about.forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });
    html += '</div>';

    // Services
    html += '<div class="section"><h2><i class="uil uil-apps"></i> Services Offered</h2><div class="svc-grid">';
    c.services.forEach(function(s){
      html += '<div class="svc"><i class="uil ' + s[0] + '"></i><div class="n">' + esc(s[1]) + '</div></div>';
    });
    html += '</div></div>';

    // Why Choose
    if (c.reasons && c.reasons.length) {
      html += '<div class="section"><h2><i class="uil uil-award"></i> Why Choose ' + esc(c.name) + '</h2><div class="reasons">';
      c.reasons.forEach(function(r){
        html += '<div class="r"><div class="ic"><i class="uil ' + r[0] + '"></i></div>' +
                '<div><h3>' + esc(r[1]) + '</h3><p>' + esc(r[2]) + '</p></div></div>';
      });
      html += '</div></div>';
    }

    // Public snapshot
    html += '<div class="section"><h2><i class="uil uil-star"></i> Public Review Snapshot</h2>' +
            '<div class="snapnote"><span class="tag">' + esc(c.platformTag) + '</span><br>' + c.platform + '</div></div>';

    // Verified facts
    html += '<div class="section"><h2><i class="uil uil-check-circle"></i> Verified / Sourceable Facts</h2><ul class="verified">';
    c.verified.forEach(function(v){
      html += '<li><i class="uil uil-check-circle"></i><span>' + esc(v) + '</span></li>';
    });
    html += '</ul></div>';

    // FAQ
    html += '<div class="section"><h2><i class="uil uil-comment-question"></i> Frequently Asked Questions</h2><div class="faq">';
    var faqs = [
      ['What does the Editorial Rating mean for ' + c.name + '?',
       'The ' + c.score + '/5 Editorial Rating is this website\u2019s own comparison score, not a Google, HomeStars or BBB rating. It reflects editorial evidence strength within this Ontario window-and-door comparison set.'],
      ['What is ' + c.name + '\u2019s public review snapshot?',
       c.name + ' shows ' + c.google + ' (' + c.platformTag.replace(/^PUBLIC REVIEW SNAPSHOT · /,'') + '). These live metrics change over time and should be re-checked before publishing.'],
      ['Which products and services does ' + c.name + ' offer?',
       c.name + ' covers ' + c.services.map(function(s){ return s[1]; }).join(', ') + '.'],
      ['What area does ' + c.name + ' serve?',
       (c.serves ? c.name + ' serves ' + c.serves + '.' : '') + (c.location ? ' It is based in ' + c.location + '.' : '')]
    ];
    faqs.forEach(function(f){
      html += '<details><summary>' + esc(f[0]) + '<span class="chev"><i class="uil uil-angle-down"></i></span></summary>' +
              '<div class="ans">' + esc(f[1]) + '</div></details>';
    });
    html += '</div></div>';

    html += '</div>'; // main-col

    // SIDEBAR
    html += '<aside class="side-col">';

    // key facts
    html += '<div class="panel"><h3>Key Facts</h3><div class="facts-list">';
    c.facts.forEach(function(f){
      html += '<div class="f"><i class="uil ' + f[0] + '"></i><div><div class="k">' + esc(f[1]) + '</div><div class="v">' + esc(f[2]) + '</div></div></div>';
    });
    html += '</div></div>';

    // trust / highlight
    html += '<div class="panel"><h3>Editorial Highlight</h3>' +
            '<div class="trust-list"><div class="tr"><i class="uil uil-award"></i><span>' + esc(c.highlight) + '</span></div></div></div>';

    // sources
    html += '<div class="panel"><h3>Sources</h3><ul class="src-list">';
    c.sources.forEach(function(s){
      html += '<li><i class="uil uil-link"></i>' + esc(s) + '</li>';
    });
    html += '</ul></div>';

    html += '</aside></div>'; // body

    // disclaimer
    html += '<div class="disclaimer"><strong>Verify before launch:</strong> The public review snapshot was captured from a standardized third-party comparison on or around 26 October 2026 and changes over time — re-check the live Google / HomeStars rating and review count before publishing. Company-stated figures (homeowner counts, years in business, warranties, facility sizes, awards and founding dates) have not been independently verified and are identified as company-stated where appropriate. The Editorial Rating is our own comparison score, not a Google, HomeStars or BBB rating.</div>';

    // foot cta
    html += '<section class="footcta"><div><h3>Comparing window &amp; door companies?</h3>' +
            '<p>See how ' + esc(c.name) + ' stacks up against the rest of the Ontario field in our full editorial ranking.</p></div>' +
            '<a class="b" href="/">Back to the full ranking <i class="uil uil-arrow-right arrow"></i></a></section>';

    page.innerHTML = html;
  }

  // ---------- Back to top ----------
  (function () {
    var btn = document.getElementById('toTop');
    if (!btn) return;
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    var onScroll = function () {
      if (window.scrollY > 500) btn.classList.add('show');
      else btn.classList.remove('show');
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>

</body>
</html>
